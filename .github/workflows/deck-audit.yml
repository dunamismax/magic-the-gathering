name: Commander deck audit

on:
  push:
    paths:
      - "deck-list-audit/**"
      - ".github/workflows/deck-audit.yml"
  pull_request:
    paths:
      - "deck-list-audit/**"
      - ".github/workflows/deck-audit.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deck-list-audit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile scripts
        run: python -m compileall -q scripts tests
      - name: Run adversarial and integration tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
      - name: Verify all generated evidence
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/check_system.py
